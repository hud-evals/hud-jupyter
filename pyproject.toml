[project]
name = "hud-jupyter"
version = "0.1.0"
description = "HUD Jupyter Environment for SpreadSheetBench"
authors = [{name = "HUD Team"}]
requires-python = ">=3.11,<3.13"
dependencies = [
    "hud-python>=0.5.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "jupyter-client>=8.0.0",
    "jupyter-kernel-gateway>=3.0.0",
    "ipython>=8.0.0",
    "nbformat>=5.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "tornado>=6.0.0",
    "aiohttp>=3.8.0",
    "anthropic>=0.75.0",
    "openai>=2.13.0",
    "google-genai>=1.55.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hud]
image = "hud-jupyter:dev"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tools", "evaluate", "setup", "scenarios"]
